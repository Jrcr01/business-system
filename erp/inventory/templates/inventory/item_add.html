{% extends "core/base.html" %}
{% block title %}Add item{% endblock %}
{% block content %}
<div class="head"><h1>Add item</h1></div>
<form class="card" method="post" style="max-width:520px" novalidate>
  {% csrf_token %}
  <label for="category">Category</label>
  <select id="category" name="category">
    {% for key, label in categories %}<option value="{{ key }}" {% if d.category == key %}selected{% endif %}>{{ label }}</option>{% endfor %}
  </select>
  <label for="brand">Brand</label>
  <input id="brand" name="brand" type="text" value="{{ d.brand }}" placeholder="Bridgestone" required>
  <label for="size_model">Size (tires) or model (batteries, mags)</label>
  <input id="size_model" name="size_model" type="text" value="{{ d.size_model }}" placeholder="185/65R15 or NS60" required>
  <label for="remark">Remarks (optional)</label>
  <input id="remark" name="remark" type="text" value="{{ d.remark }}" placeholder="only to tell two lots apart, e.g. old stock 2023">
  <p class="note">The system gives the item its code. Stock comes with a stock in.</p>
  <div style="display:flex;gap:10px;margin-top:14px">
    <button class="btn btn-main" type="submit">Add item</button>
    <a class="btn" href="{% url 'inv_items' %}">Cancel</a>
  </div>
</form>
{% endblock %}
