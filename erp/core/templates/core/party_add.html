{% extends "core/base.html" %}
{% block title %}Add customer{% endblock %}
{% block content %}
<div class="head"><h1>Add customer</h1></div>
<form class="card" method="post" style="max-width:520px" novalidate>
  {% csrf_token %}
  <label for="id_name">Name</label>
  <input id="id_name" name="name" type="text" value="{{ form.name.value|default:'' }}" required autofocus>
  {{ form.name.errors }}
  <label for="id_contact_number">Contact number</label>
  <input id="id_contact_number" name="contact_number" type="text" value="{{ form.contact_number.value|default:'' }}" placeholder="0917 123 4567">
  <label for="id_address">Address</label>
  <input id="id_address" name="address" type="text" value="{{ form.address.value|default:'' }}">
  <p class="note">New customers buy in cash. The owner turns on credit.</p>
  <div style="display:flex;gap:10px;margin-top:16px">
    <button class="btn btn-main" type="submit">Add customer</button>
    <a class="btn" href="{% url 'parties' %}">Cancel</a>
  </div>
</form>
{% endblock %}
